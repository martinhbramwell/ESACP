---
# Plain (unencrypted) group variables
# Secrets go in all.sops.yml

# ── WireGuard network (all hosts that run the wireguard role) ──────────────
# Public keys are non-secret and safe to commit.
# Private keys and PSKs are in config/wireguard/keys.sops.yml (SOPS/age encrypted).
wg_port: 51820
wg_subnet: "10.10.0.0/24"

# Hub identity — derived from hosts_map.yml (wg_role: hub).
# Used by roles and playbooks instead of hardcoding "saconsole" or "10.10.0.1".
hub_key: "saconsole"
hub_vm_name: "saconsole"
hub_hostname: "saconsole"
hub_display_name: "Hub Console"
hub_virbr0_ip: "192.168.122.10"
hub_wg_ip: "10.10.0.1"

# Controller WireGuard hub endpoint — the hypervisor's LAN hostname.
# Used by Play 5 (controller WireGuard) which runs on localhost and does
# NOT inherit group_vars/kvm.yml.
controller_wg_hub_endpoint: "toshy.iridium.blue"

wg_pubkey_controller: "j94APdOpRArs3J78vcnRVJC5ALIFy/W9qLFacKbwGzk="
wg_pubkey_saconsole:  "nn916J0YAufbwZNOKvWs2VX6sV4BKuTqE//985lIiRw="
wg_pubkey_dev03: "9joY/mn1ZrvczXKnF+L6qvP5M3cYFKgRTIOR0RDHHiA="
wg_pubkey_target5: "8AFeP+XoqOyPTRNq6dINJxICREcixQ/wz7B1gZpdFRA="
wg_pubkey_dev01: "ySQtN5mnR8+zEYM/Saxx/j9kO+nAq0liiLhtma/a3zw="
wg_pubkey_dev02: "N8kt+IjisRGMMAHrsV808os+SB8e5m8ISyRU3dJ+bmU="

# ── System configuration ───────────────────────────────────────────────────
system_timezone: "America/New_York"
system_locale: "en_US.UTF-8"

# Admin users (SSH access)
# username and ssh_key are derived from the Ansible connection — no hardcoding needed.
# To change the admin user, update ansible_user in ansible/inventory/dev.yml.
admin_users:
  - username: "{{ ansible_user }}"
    ssh_key: "{{ lookup('file', (ansible_ssh_private_key_file | default('~/.ssh/id_ed25519')) + '.pub') }}"
    groups:
      - sudo
      - docker

# Operator SSH public key (WSL controller key).
# handoff_console.sh copies ~/.ssh/id_ed25519.pub → hub:~/.ssh/operator.pub
# so Ansible (running on the hub) can install it on every managed host.
# Gracefully absent when running Ansible directly from WSL (file won't exist there).
operator_ssh_key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/operator.pub', errors='ignore') | default('') }}"

# SSH configuration
ssh_port: 22
ssh_permit_root_login: "no"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"
ssh_allow_users: "{{ ansible_user }}"

# allowed_ssh_ips is defined per-host in inventory/dev.yml (not a global default)

# Firewall rules (UFW)
firewall_allowed_ports:
  - { port: 443, proto: tcp, rule: allow, comment: "HTTPS" }
  # SSH is handled exclusively via allowed_ssh_ips (IP-restricted rules below)

# Docker configuration
docker_users:
  - "{{ ansible_user }}"

docker_compose_version: "2.24.5"

# acme.sh / Let's Encrypt
# Email for expiry notifications from Let's Encrypt (optional but recommended).
# Set to a real address: acme_sh_email: "admin@example.com"
acme_sh_email: ""

# Nginx configuration
nginx_server_name: "_"  # Accept any hostname (dev environment)
nginx_ssl_certificate: "/etc/nginx/ssl/selfsigned.crt"
nginx_ssl_certificate_key: "/etc/nginx/ssl/selfsigned.key"

# Grafana configuration
grafana_port: 3000
grafana_domain: "{{ ansible_host }}"
grafana_root_url: "http://{{ grafana_domain }}:{{ grafana_port }}/"
grafana_enable_anonymous: false

# Prometheus configuration
prometheus_port: 9090
prometheus_retention_days: 15

# Loki configuration
loki_port: 3100
loki_retention_days: 7

# Alertmanager configuration
alertmanager_port: 9093
# telegram_chat_id is in all.sops.yml (encrypted)

# Node exporter
node_exporter_port: 9100

# Authelia configuration
authelia_port: 9091
authelia_domain: "{{ ansible_host }}"
authelia_session_expiration: "1h"
authelia_inactivity_timeout: "5m"

# MFA toggle state
mfa_enabled: false  # Set to true to enable MFA by default

# Security settings
fail2ban_enabled: true
fail2ban_maxretry: 5
fail2ban_bantime: 3600
fail2ban_findtime: 600

unattended_upgrades_enabled: true

# Backup configuration (future stages)
backup_enabled: false
backup_retention_days: 30

# Feature flags
observability_stack_enabled: true
mermaid_diagrams_enabled: true
alerting_enabled: true

# Alert profile: 'production' or 'drill'
# Overridden to 'drill' in group_vars/lab.yml, enforced to 'production' in group_vars/production.yml
alert_profile: production

# ── ERPNext ───────────────────────────────────────────────────────────────────
# Unix user that owns the frappe-bench installation inside ERPNext VMs.
# Referenced by Packer build scripts and the differentiation pipeline in api.py.
# Change here propagates everywhere — this is the single source of truth.
erp_user: erpadm
