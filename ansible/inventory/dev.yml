---
# ansible/inventory/dev.yml
# VirtualBox platform — Platform 1 (Windows 11 + WSL2 + VirtualBox)
#
# Connection settings (ansible_user, SSH key, python interpreter) are in
# ansible/group_vars/vbox.yml — not duplicated here.
#
# BOOTSTRAP NOTE: Before WireGuard is provisioned on a target, ansible_host
# must be the bridged DHCP IP (not the WireGuard IP). Two options:
#
#   Option A — override on the command line for first run:
#     ansible-playbook ... --limit target1 -e ansible_host=<DHCP_IP>
#
#   Option B — temporarily edit ansible_host below, re-run, then revert.
#
# After WireGuard is up, Ansible connects via the WireGuard IPs shown below.
#
# Get a target's DHCP IP after autoinstall completes:
#   VBoxManage.exe guestproperty get target1 '/VirtualBox/GuestInfo/Net/0/V4/IP'

all:
  children:

    vbox:
      hosts:
        saconsole:
          ansible_host: "192.168.40.49"
          ansible_user: ernest
          wg_ip: "10.10.0.1"
          wg_role: hub
        target1:
          # WireGuard IP — use DHCP IP for first bootstrap run (see note above)
          ansible_host: "10.10.0.3"
          wg_ip: "10.10.0.3"
          wg_role: spoke
        target2:
          # WireGuard IP — use DHCP IP for first bootstrap run (see note above)
          ansible_host: "10.10.0.4"
          wg_ip: "10.10.0.4"
          wg_role: spoke

    targets:
      hosts:
        target1: {}
        target2: {}

    development:
      hosts:
        saconsole: {}
        target1: {}
        target2: {}

    # lab group: same hosts as development but sets alert_profile: drill
    # (via group_vars/lab.yml) for faster alert testing.
    lab:
      hosts:
        saconsole: {}
        target1: {}
        target2: {}
