---
# Common Role - Base System Configuration
# Handles: passwordless sudo, system packages, timezone, security updates

- include_tasks: "{{ playbook_dir }}/tasks/dpkg_lock.yml"

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Update /etc/hosts with correct hostname
  lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"

- name: Preserve hostname across cloud-init reboots
  copy:
    dest: /etc/cloud/cloud.cfg.d/99_preserve_hostname.cfg
    content: "preserve_hostname: true\n"
    mode: '0644'

- name: Set system timezone
  timezone:
    name: "{{ system_timezone }}"

- name: Set system locale
  locale_gen:
    name: "{{ system_locale }}"
    state: present

- name: Install essential packages
  apt:
    name:
      - curl
      - wget
      - git
      - vim
      - htop
      - net-tools
      - ca-certificates
      - gnupg
      - lsb-release
      - software-properties-common
      - apt-transport-https
      - python3
      - python3-pip
      - jq
      - cloud-guest-utils
    state: present
    update_cache: yes
  register: apt_install
  until: apt_install is succeeded
  retries: 10
  delay: 15

- name: Configure passwordless sudo for admin users
  lineinfile:
    path: /etc/sudoers.d/admin-nopasswd
    line: "{{ item.username }} ALL=(ALL) NOPASSWD:ALL"
    create: yes
    mode: '0440'
    validate: 'visudo -cf %s'
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.username }}"

- name: Ensure docker group exists (before adding users to it)
  group:
    name: docker
    state: present

- name: Ensure admin users exist
  user:
    name: "{{ item.username }}"
    groups: "{{ item.groups }}"
    append: yes
    shell: /bin/bash
    create_home: yes
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.username }}"

- name: Add SSH keys for admin users
  authorized_key:
    user: "{{ item.username }}"
    key: "{{ item.ssh_key }}"
    state: present
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.username }}"
  when: item.ssh_key is defined

- name: Add operator WSL key for direct SSH access
  authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ operator_ssh_key }}"
    state: present
  when: operator_ssh_key | length > 0

- name: Create useful shell aliases
  copy:
    dest: /etc/profile.d/esacp_aliases.sh
    mode: '0644'
    content: |
      # ESACP Shell Aliases
      alias suda='sudo -A'
      alias dps='docker ps --format "table {{ '{{' }}.Names{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"'
      alias dlog='docker-compose -f /opt/observability/docker-compose.yml logs -f'
      alias drestart='docker-compose -f /opt/observability/docker-compose.yml restart'
      alias mfa_on='/opt/scripts/mfa_toggle.sh on'
      alias mfa_off='/opt/scripts/mfa_toggle.sh off'
      alias ssh_lock='/opt/scripts/ssh_toggle.sh lock'
      alias ssh_open='/opt/scripts/ssh_toggle.sh open'

- name: Enable unattended security updates
  apt:
    name: unattended-upgrades
    state: present
  when: unattended_upgrades_enabled | default(true)

- name: Configure unattended upgrades
  template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
  when: unattended_upgrades_enabled | default(true)

- name: Enable automatic updates
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";
  when: unattended_upgrades_enabled | default(true)

- name: Unmask and re-enable apt-daily timers now that provisioning apt work is done
  systemd:
    name: "{{ item }}"
    masked: no
    enabled: yes
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  when: unattended_upgrades_enabled | default(true)
  failed_when: false

- name: Disable SSH password authentication for root (defense in depth)
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  notify: restart sshd

- name: Expand root LVM to fill disk
  shell: |
    PV=$(pvs --noheadings -o pv_name 2>/dev/null | tr -d ' ' | head -1)
    [ -z "$PV" ] && echo "NOCHANGE: no LVM PV" && exit 0
    DISK=$(echo "$PV" | sed 's/[0-9]*$//')
    PART=$(echo "$PV" | grep -oE '[0-9]+$')
    GROW=$(growpart $DISK $PART 2>&1) || true
    if echo "$GROW" | grep -q "^CHANGED"; then
        pvresize $PV
        lvextend -l +100%FREE /dev/ubuntu-vg/ubuntu-lv 2>&1 || true
        resize2fs /dev/mapper/ubuntu--vg-ubuntu--lv 2>&1 || true
        echo "CHANGED"
    else
        echo "NOCHANGE"
    fi
  register: lvm_expand
  changed_when: "'CHANGED' in lvm_expand.stdout"
  failed_when: false

- name: Create scripts directory
  file:
    path: /opt/scripts
    state: directory
    mode: '0755'

- name: Create observability directory
  file:
    path: /opt/observability
    state: directory
    mode: '0755'
