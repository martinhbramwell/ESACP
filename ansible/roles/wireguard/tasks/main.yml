---
# wireguard role — install WireGuard and configure wg0 interface
#
# Required host vars (set in inventory/kvm.yml via hosts_map.yml):
#   wg_ip    — this host's WireGuard IP (e.g. "10.10.0.1")
#   wg_role  — "hub" or "spoke"
#
# Required group vars (group_vars/kvm.yml):
#   wg_port, wg_pubkey_controller, wg_pubkey_saconsole, wg_pubkey_target1
#
# Private keys / PSKs are read from config/wireguard/keys.sops.yml at play time.

# Force apt-get update unconditionally — Packer-built images wipe /var/lib/apt/lists/*
# but leave /var/cache/apt/pkgcache.bin intact, so cache_valid_time would skip the update.
# Separate task ensures the index is always fresh before any package install. (fixes GH #62)
- name: Update apt cache (required after Packer image boot — lists wiped by generalise step)
  apt:
    update_cache: yes
  when: ansible_connection != 'local'

- name: Install wireguard-tools
  apt:
    name: wireguard-tools
    state: present
  when: ansible_connection != 'local'

- name: Create /etc/wireguard
  file:
    path: /etc/wireguard
    state: directory
    mode: '0700'
    owner: root
    group: root

- name: Decrypt WireGuard keys.sops.yml
  set_fact:
    wg_keys: "{{ lookup('community.sops.sops',
                 playbook_dir + '/../config/wireguard/keys.sops.yml',
                 input_type='yaml') | from_yaml }}"
  no_log: true

- name: Derive this host's WireGuard identity
  set_fact:
    wg_host_key: "{{ wg_keys[_wg_key_name] | default('UNKNOWN_HOST') }}"
  vars:
    _wg_key_name: "{{ 'controller' if inventory_hostname in ['controller', 'localhost'] else inventory_hostname }}"
  no_log: true

- name: Fail if host has no WireGuard identity in keys.sops.yml
  fail:
    msg: >
      No WireGuard key found for '{{ inventory_hostname }}' in keys.sops.yml.
      Add a keypair for this host before provisioning.
  when: wg_host_key == 'UNKNOWN_HOST'

- name: Write WireGuard private key
  copy:
    content: "{{ wg_host_key.private_key }}\n"
    dest: /etc/wireguard/private.key
    mode: '0600'
    owner: root
    group: root
  no_log: true

- name: Deploy wg0.conf
  template:
    src: wg0.conf.j2
    dest: /etc/wireguard/wg0.conf
    mode: '0600'
    owner: root
    group: root
  notify: restart wg0

- name: Open WireGuard port in UFW (hub only)
  ufw:
    rule: allow
    port: "{{ wg_port }}"
    proto: udp
    comment: "WireGuard"
  when: wg_role == 'hub'

- name: Allow UFW to forward packets between WireGuard peers (hub only)
  lineinfile:
    path: /etc/default/ufw
    regexp: '^DEFAULT_FORWARD_POLICY='
    line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
  notify: reload ufw
  when: wg_role == 'hub'

- name: Enable and start wg-quick@wg0
  systemd:
    name: wg-quick@wg0
    enabled: yes
    state: started
    daemon_reload: yes

- name: Verify WireGuard interface is up
  command: wg show wg0
  register: wg_status
  changed_when: false

- name: Show WireGuard status
  debug:
    msg: "{{ wg_status.stdout_lines }}"
