---
# node_exporter role — install Prometheus node_exporter as a systemd service
#
# Installs the binary directly (no Docker) so target1 can be monitored
# without requiring a full container stack.
# Port 9100 is restricted via UFW to the hub's WireGuard IP only.

- name: Set node_exporter version
  set_fact:
    node_exporter_version: "1.7.0"

- name: Create node_exporter system user
  user:
    name: node_exporter
    system: yes
    shell: /usr/sbin/nologin
    create_home: no

- name: Check if node_exporter binary already installed
  stat:
    path: /usr/local/bin/node_exporter
  register: ne_binary

- name: Download node_exporter
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    mode: '0644'
  when: not ne_binary.stat.exists

- name: Extract node_exporter
  unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /tmp/
    remote_src: yes
  when: not ne_binary.stat.exists

- name: Install node_exporter binary
  copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: '0755'
    owner: root
    group: root
    remote_src: yes
  when: not ne_binary.stat.exists

- name: Install node_exporter systemd service
  template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify: restart node_exporter

- name: Open node_exporter port in UFW (hub WireGuard IP only)
  ufw:
    rule: allow
    port: "9100"
    proto: tcp
    from_ip: "{{ hub_wg_ip }}"
    comment: "node_exporter — hub WireGuard only"

- name: Enable and start node_exporter
  systemd:
    name: node_exporter
    enabled: yes
    state: started
    daemon_reload: yes

- name: Verify node_exporter is responding
  uri:
    url: "http://localhost:9100/metrics"
    status_code: 200
  register: ne_health
  until: ne_health.status == 200
  retries: 10
  delay: 2
