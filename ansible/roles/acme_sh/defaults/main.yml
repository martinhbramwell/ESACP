---
acme_sh_install_dir: "/home/{{ ansible_user }}/.acme.sh"
acme_sh_cert_home: "/opt/acme-certs"
acme_sh_server: "letsencrypt"

# Email for Let's Encrypt expiry notifications (optional — renewal is automated via cron).
# In ESACP, cert expiry is monitored via Prometheus/Alertmanager → Telegram, not email.
acme_sh_email: ""

# Textfile collector dir — must match the bind-mount path in docker/observability/docker-compose.yml
# node_exporter reads *.prom files from here; deploy_cert.sh writes to it.
acme_sh_textfile_dir: "/var/lib/node_exporter/textfile_collector"

# Each entry: name = primary domain (sets acme.sh cert dir name — no wildcards in path).
#             sans = all SANs; apex domain first, wildcard second.
acme_sh_domains:
  - name: "iridium.blue"
    sans:
      - "iridium.blue"
      - "*.iridium.blue"
