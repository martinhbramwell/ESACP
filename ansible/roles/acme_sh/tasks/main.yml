---
# acme_sh role — issues wildcard TLS certs via acme.sh + Cloudflare DNS-01
# Requires: cloudflare_acme_token in group_vars/all.sops.yml (DNS:Edit for target zones)
# Certs land at: {{ acme_sh_cert_home }}/{{ domain.name }}/{cert,key,fullchain,ca}.pem
# Expiry metric: {{ acme_sh_textfile_dir }}/acme_cert_expiry.prom (read by node_exporter)

- name: Install acme.sh dependencies
  apt:
    name: [curl, git, socat, cron]
    state: present
  become: true

- name: Clone acme.sh source
  git:
    repo: https://github.com/acmesh-official/acme.sh.git
    dest: "{{ '/home/' + ansible_user }}/.acme.sh-src"
    version: master
    depth: 1
    update: false
  become: false

- name: Install acme.sh
  command: >
    ./acme.sh --install
    --home {{ acme_sh_install_dir }}
    {% if acme_sh_email | length > 0 %}--accountemail {{ acme_sh_email }}{% endif %}
    --no-cron
  args:
    chdir: "{{ '/home/' + ansible_user }}/.acme.sh-src"
    creates: "{{ acme_sh_install_dir }}/acme.sh"
  become: false

- name: Create cert output directories
  file:
    path: "{{ acme_sh_cert_home }}/{{ item.name }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop: "{{ acme_sh_domains }}"
  become: true

- name: Create textfile collector directory (readable by node_exporter, writable by ansible_user)
  file:
    path: "{{ acme_sh_textfile_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  become: true

- name: Deploy cert renewal hook script
  template:
    src: deploy_cert.sh.j2
    dest: "{{ acme_sh_cert_home }}/deploy_cert.sh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0750"
  become: true

- name: Issue wildcard cert via Cloudflare DNS-01
  command: >
    {{ acme_sh_install_dir }}/acme.sh
    --issue
    --server {{ acme_sh_server }}
    --dns dns_cf
    {% for san in item.sans %}--domain {{ san }} {% endfor %}
  environment:
    CF_Token: "{{ cloudflare_acme_token }}"
    HOME: "{{ '/home/' + ansible_user }}"
  register: acme_issue
  # exit 0 = new/renewed cert  exit 2 = still valid, skip  exit 1 = error
  changed_when: acme_issue.rc == 0
  failed_when: acme_issue.rc not in [0, 2]
  become: false
  loop: "{{ acme_sh_domains }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install cert files to standard location
  command: >
    {{ acme_sh_install_dir }}/acme.sh
    --install-cert
    --domain {{ item.name }}
    --ecc
    --cert-file      {{ acme_sh_cert_home }}/{{ item.name }}/cert.pem
    --key-file       {{ acme_sh_cert_home }}/{{ item.name }}/key.pem
    --fullchain-file {{ acme_sh_cert_home }}/{{ item.name }}/fullchain.pem
    --ca-file        {{ acme_sh_cert_home }}/{{ item.name }}/ca.pem
    --reloadcmd      "{{ acme_sh_cert_home }}/deploy_cert.sh"
  environment:
    HOME: "{{ '/home/' + ansible_user }}"
  register: acme_install
  changed_when: "'Installing cert to' in acme_install.stdout"
  become: false
  loop: "{{ acme_sh_domains }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure cert files are owned by ansible_user (readable for distribution)
  file:
    path: "{{ acme_sh_cert_home }}/{{ item.name }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: true
  loop: "{{ acme_sh_domains }}"
  become: true

- name: Write initial cert expiry metrics
  command: "{{ acme_sh_cert_home }}/deploy_cert.sh"
  become: false
  changed_when: false

- name: Set up weekly renewal cron
  cron:
    name: "acme.sh renewal"
    minute: "22"
    hour: "3"
    day: "*/7"
    job: >
      {{ acme_sh_install_dir }}/acme.sh
      --cron --home {{ acme_sh_install_dir }}
      >> /tmp/acme-renew.log 2>&1
    user: "{{ ansible_user }}"
