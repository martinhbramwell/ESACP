---
# control_plane role — hub VM as Ansible controller + Cytoscape UI host
#
# After this role runs:
#   - ESACP repo is cloned at /opt/esacp
#   - Ansible + SOPS + required collections are installed
#   - SOPS age key is deployed for secret decryption
#   - Hub has an SSH keypair at ~/.ssh/id_ed25519
#   - hub_ssh_pubkey fact is registered for use by sibling plays
#   - Node.js is installed; Cytoscape app is built to /opt/esacp/prototypes/cytoscape/dist/
#   - nginx serves the Cytoscape app on port {{ cytoscape_port }}
#
# Applied to the hub only (Play 2 in site-kvm.yml).
# Play 3 reads hub_ssh_pubkey from hostvars and pushes it to targets.

# ── Ansible + SOPS ────────────────────────────────────────────────────────────

- name: Install Ansible
  apt:
    name: ansible
    state: present

- name: Check if SOPS binary is installed
  stat:
    path: /usr/local/bin/sops
  register: sops_binary

- name: Download SOPS binary
  get_url:
    url: "https://github.com/getsops/sops/releases/download/v{{ sops_version }}/sops-v{{ sops_version }}.linux.amd64"
    dest: /usr/local/bin/sops
    mode: '0755'
  when: not sops_binary.stat.exists

# ── ESACP repo ────────────────────────────────────────────────────────────────

- name: Create /opt/esacp directory
  file:
    path: "{{ esacp_repo_dest }}"
    state: directory
    mode: '0755'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Clone ESACP repository
  become_user: "{{ ansible_user }}"
  git:
    repo: "{{ esacp_repo_url }}"
    dest: "{{ esacp_repo_dest }}"
    version: "{{ esacp_repo_version }}"
    update: yes

- name: Install required Ansible collections
  become_user: "{{ ansible_user }}"
  command:
    cmd: "ansible-galaxy collection install -r {{ esacp_repo_dest }}/ansible/requirements.yml"
  changed_when: false

# ── Secrets ───────────────────────────────────────────────────────────────────

- name: Create SOPS age key directory
  file:
    path: "/home/{{ ansible_user }}/.config/sops/age"
    state: directory
    mode: '0700'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Deploy SOPS age key
  copy:
    content: "{{ lookup('file', lookup('env', 'HOME') + '/.config/sops/age/keys.txt') }}"
    dest: "/home/{{ ansible_user }}/.config/sops/age/keys.txt"
    mode: '0600'
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

# ── SSH keypair ───────────────────────────────────────────────────────────────

- name: Generate hub SSH keypair
  become_user: "{{ ansible_user }}"
  command:
    cmd: >
      ssh-keygen -t ed25519
      -f /home/{{ ansible_user }}/.ssh/id_ed25519
      -N ''
      -C {{ hub_key }}-control-plane
    creates: "/home/{{ ansible_user }}/.ssh/id_ed25519"

- name: Read hub public key
  slurp:
    src: "/home/{{ ansible_user }}/.ssh/id_ed25519.pub"
  register: hub_pubkey_raw

- name: Register hub public key as host fact
  set_fact:
    hub_ssh_pubkey: "{{ hub_pubkey_raw.content | b64decode | trim }}"

# ── Node.js ───────────────────────────────────────────────────────────────────

- name: Check if Node.js is installed
  stat:
    path: /usr/bin/node
  register: node_binary

- name: Add NodeSource apt repository
  shell: curl -fsSL https://deb.nodesource.com/setup_{{ nodejs_version }}.x | bash -
  args:
    creates: /etc/apt/sources.list.d/nodesource.list
  when: not node_binary.stat.exists

- name: Install Node.js
  apt:
    name: nodejs
    state: present
    update_cache: yes
  when: not node_binary.stat.exists

# ── Cytoscape app build ───────────────────────────────────────────────────────

- name: Install Cytoscape npm dependencies
  become_user: "{{ ansible_user }}"
  command:
    cmd: npm install
    chdir: "{{ esacp_repo_dest }}/prototypes/cytoscape"
  changed_when: false

- name: Build Cytoscape app
  become_user: "{{ ansible_user }}"
  command:
    cmd: npm run build
    chdir: "{{ esacp_repo_dest }}/prototypes/cytoscape"
  changed_when: false

# ── nginx ─────────────────────────────────────────────────────────────────────

- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Remove nginx default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Deploy Cytoscape nginx site config
  template:
    src: cytoscape-nginx.conf.j2
    dest: /etc/nginx/sites-available/cytoscape
    mode: '0644'
  notify: reload nginx

- name: Enable Cytoscape nginx site
  file:
    src: /etc/nginx/sites-available/cytoscape
    dest: /etc/nginx/sites-enabled/cytoscape
    state: link
  notify: reload nginx

- name: Open Cytoscape port in UFW
  ufw:
    rule: allow
    port: "{{ cytoscape_port | string }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "Cytoscape topology UI"
  loop: "{{ allowed_ssh_ips | default([]) }}"

- name: Ensure nginx is running and enabled
  service:
    name: nginx
    state: started
    enabled: yes
