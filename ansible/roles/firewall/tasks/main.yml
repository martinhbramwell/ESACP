---
# Firewall Role - UFW Configuration

- name: Install UFW
  apt:
    name: ufw
    state: present
    update_cache: yes

- name: Reset UFW to defaults (first run only)
  command: ufw --force reset
  when: ansible_facts.services['ufw.service'] is not defined or
        ansible_facts.services['ufw.service'].state != 'running'
  changed_when: true

- name: Set UFW default policies
  ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: 'incoming', policy: 'deny' }
    - { direction: 'outgoing', policy: 'allow' }
    - { direction: 'routed', policy: 'deny' }

- name: Allow firewall rules
  ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ firewall_allowed_ports }}"
  loop_control:
    label: "{{ item.comment | default(item.port) }}"

- name: Remove unrestricted SSH rule (replaced by IP-restricted rules below)
  ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    delete: yes
  ignore_errors: yes

- name: Restrict SSH to specific IPs (if defined)
  ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    from_ip: "{{ item }}"
    comment: "SSH from allowed network"
  loop: "{{ allowed_ssh_ips | default([]) }}"
  when: allowed_ssh_ips is defined and allowed_ssh_ips | length > 0

- name: Enable UFW
  ufw:
    state: enabled

- name: Ensure UFW is started and enabled
  service:
    name: ufw
    state: started
    enabled: yes
