[defaults]
# Inventory
inventory = ./inventory/dev.yml
host_key_checking = False

# Performance
forks = 5
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Output
stdout_callback = ansible.builtin.yaml
bin_ansible_callbacks = True
display_skipped_hosts = False
display_ok_hosts = True

# Logging
log_path = /tmp/ansible.log

# Roles
roles_path = ./roles

# SSH
# remote_user is set per-host via ansible_user in inventory/dev.yml
# private_key_file is set via ANSIBLE_PRIVATE_KEY_FILE env var in provision.py
#   (falls back to ~/.ssh/id_ed25519 if SSH_KEY_PATH is not exported)
timeout = 30

# Vars plugins (enables SOPS decryption via community.sops collection)
vars_plugins_enabled = host_group_vars,community.sops.sops

[inventory]
enable_plugins = yaml, ini

[privilege_escalation]
# become = True
# become_method = sudo
# become_user = root
# become_ask_pass = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

# SOPS Integration Notes:
# 
# Ansible will automatically decrypt .sops.yml files if you have the 
# sops_vars plugin or community.sops collection installed:
#
#   ansible-galaxy collection install community.sops
#
# Variables in group_vars/all.sops.yml will be automatically decrypted
# and merged with group_vars/all.yml during playbook execution.
