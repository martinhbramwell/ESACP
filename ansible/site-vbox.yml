---
# site-vbox.yml — Top-level playbook for ESACP VirtualBox hosts (Platform 1)
#
# Play order:
#   1. All VBox hosts:  common, ssh, firewall, fail2ban, wireguard
#   2. saconsole:       docker, observability
#   3. saconsole:       control_plane (repo, toolchain, SSH keypair, Cytoscape on nginx:8090)
#   4. targets:         authorise saconsole SSH key
#   5. targets:         docker, node_exporter, mariadb
#   6. controller:      wireguard spoke (WSL — connection: local)
#
# Usage (from project root):
#   ansible-playbook -i ansible/inventory/dev.yml ansible/site-vbox.yml
#   ansible-playbook -i ansible/inventory/dev.yml ansible/site-vbox.yml --limit saconsole
#   ansible-playbook -i ansible/inventory/dev.yml ansible/site-vbox.yml --limit targets
#   ansible-playbook -i ansible/inventory/dev.yml ansible/site-vbox.yml --tags wireguard
#   ansible-playbook -i ansible/inventory/dev.yml ansible/site-vbox.yml --tags mariadb
#
# Bootstrap note: before WireGuard is up on targets, override ansible_host to the
# bridged DHCP IP for the first run:
#   ansible-playbook ... --limit target1 -e ansible_host=<DHCP_IP>

# ── Play 1: Base configuration for all VirtualBox VMs ────────────────────────
- name: Base configuration — all VBox hosts
  hosts: vbox
  become: yes
  roles:
    - common
    - ssh
    - firewall
    - fail2ban
    - wireguard

# ── Play 2: saconsole — observability stack + control plane API ──────────────
- name: Observability stack — saconsole
  hosts: saconsole
  become: yes
  roles:
    - docker
    - observability
    - { role: esacp_api, tags: [esacp_api] }

# ── Play 3: saconsole — control plane (repo, toolchain, SSH keypair) ─────────
- name: Control plane — saconsole
  hosts: saconsole
  become: yes
  roles:
    - control_plane

# ── Play 4: Push saconsole SSH key to targets ─────────────────────────────────
# Reads saconsole_ssh_pubkey set by the control_plane role in Play 3.
# Safe to skip when running --limit saconsole or --limit targets alone.
- name: Authorise saconsole on targets
  hosts: targets
  become: yes
  tasks:
    - name: Add saconsole public key to authorized_keys
      authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ hostvars['saconsole']['saconsole_ssh_pubkey'] }}"
        state: present
      when: hostvars['saconsole']['saconsole_ssh_pubkey'] is defined

# ── Play 5: Targets — Docker + node_exporter + MariaDB ───────────────────────
- name: node_exporter + MariaDB — vbox targets
  hosts: targets
  become: yes
  roles:
    - docker
    - node_exporter
    - mariadb

# ── Play 6: WireGuard spoke — controller (WSL, runs locally) ─────────────────
# Mirrors site-kvm.yml Play 4. Configures wg0 on WSL so Ansible can reach
# targets via WireGuard IPs (10.10.0.3/4) without NAT port-forward overrides.
#
# Tagged controller_wg so provision_targets.sh (runs on saconsole) can skip it.
# saconsole IS the hub — running the spoke role on localhost would overwrite its config.
- name: WireGuard spoke — controller
  hosts: localhost
  connection: local
  become: yes
  gather_facts: no
  tags: [controller_wg]
  vars:
    inventory_hostname: controller
    wg_ip: "10.10.0.2"
    wg_role: spoke
    wg_hub_endpoint: "{{ hostvars['saconsole']['ansible_host'] }}"
  roles:
    - wireguard
