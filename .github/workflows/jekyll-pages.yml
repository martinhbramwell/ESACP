name: Jekyll Pages (on_boarding)

# Builds the Jekyll landing page under on_boarding/docs/ and deploys to
# GitHub Pages. The Mode-A persona doc (on_boarding/docs/first_dialog.md)
# and the spec sheets are front-matter-less .md files that Jekyll copies
# verbatim into _site, so they serve raw at /first_dialog.md and /specs/…
# — no manual staging step needed. Per ESACP#616 the persona doc moved
# onto this same Jekyll-passthrough mechanism (was the #505/#497 install
# hack from the gist→Pages migration; retired here).
#
# Baseurl handling: Option A from #505 — local _config.yml stays at
# baseurl: "" for ergonomic localhost serve; CI builds with the flag.

on:
  push:
    branches:
      - on_boarding
    paths:
      - 'on_boarding/docs/**'
      - '.github/workflows/jekyll-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: on_boarding/docs

      - name: Build site
        working-directory: on_boarding/docs
        run: bundle exec jekyll build --baseurl ""

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: on_boarding/docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
