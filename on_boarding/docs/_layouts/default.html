<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/chat.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/favicon/favicon-96x96.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/assets/favicon/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/assets/favicon/site.webmanifest' | relative_url }}">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>{{ page.title | default: site.title }}</h1>
      {% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
    </header>
    <section class="chat">
      {{ content }}
    </section>
    <footer class="page-footer">
      <p>Static mock — no chatbot wired up yet. See
        <code>on_boarding/internal_docs/entry-architecture-notes.md</code>
        for the live-chat architecture this page seeds.</p>
    </footer>
  </main>
</body>
</html>
