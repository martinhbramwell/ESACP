server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # System logs from journald
  - job_name: systemd-journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'

  # Auth logs (SSH, sudo, authentication)
  - job_name: auth
    static_configs:
      - targets:
          - localhost
        labels:
          job: auth
          __path__: /var/log/auth.log

  # Syslog
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog

  # Fail2ban logs
  - job_name: fail2ban
    static_configs:
      - targets:
          - localhost
        labels:
          job: fail2ban
          __path__: /var/log/fail2ban.log

  # Docker container logs — discovered via Docker socket.
  # Provides container_name, stream, and image labels automatically.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Strip leading slash from container name (Docker prefixes it)
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container_name
      # Preserve stdout vs stderr stream label
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      # Keep the container image for context
      - source_labels: [__meta_docker_container_image_name]
        target_label: image

  # Nginx access logs (future)
  # - job_name: nginx-access
  #   static_configs:
  #     - targets:
  #         - localhost
  #       labels:
  #         job: nginx-access
  #         __path__: /var/log/nginx/access.log

  # Nginx error logs (future)
