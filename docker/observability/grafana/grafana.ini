[server]
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s/grafana/
serve_from_sub_path = true

[security]
admin_user = ${GRAFANA_ADMIN_USER}
admin_password = ${GRAFANA_ADMIN_PASSWORD}
disable_gravatar = true
cookie_secure = false  # Nginx handles TLS
cookie_samesite = lax

[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
default_theme = dark

[auth]
disable_login_form = false
oauth_auto_login = false

[auth.anonymous]
enabled = false

[auth.basic]
enabled = true

[auth.proxy]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[snapshots]
external_enabled = false

[dashboards]
versions_to_keep = 20
min_refresh_interval = 5s

[dataproxy]
timeout = 300
keep_alive_seconds = 300

[alerting]
enabled = true
execute_alerts = true

[unified_alerting]
enabled = false  # Use Prometheus/Alertmanager

[log]
mode = console
level = info

[log.console]
level = info
format = json

[metrics]
enabled = true

[plugins]
enable_alpha = false
plugin_admin_enabled = true
