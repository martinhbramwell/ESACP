version: '3.8'

# ESACP Observability Stack
# Components: Grafana, Prometheus, Loki, Promtail, Alertmanager, node_exporter

networks:
  observability:
    name: observability_network
    driver: bridge

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  alertmanager_data:

services:
  # Grafana - Dashboards and Visualization
  grafana:
    image: grafana/grafana:10.2.3
    container_name: grafana
    restart: unless-stopped
    user: "472"
    networks:
      - observability
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL}
      - GF_INSTALL_PLUGINS=marcusolsson-dynamictext-panel
    depends_on:
      - prometheus
      - loki

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    restart: unless-stopped
    user: "65534"
    networks:
      - observability
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # resolves to host IP; used to scrape node_exporter
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - alertmanager
      - node_exporter

  # Alertmanager - Alert Routing
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    restart: unless-stopped
    user: "65534"
    networks:
      - observability
    ports:
      - "9093:9093"
    volumes:
      - alertmanager_data:/alertmanager
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'

  # Node Exporter - Host Metrics
  # network_mode: host gives the container the host's network namespace so that:
  #   (a) nodename in node_uname_info matches the VM hostname (saconsole), not a container ID
  #   (b) wg0 and all other host interfaces are visible to the collector
  # Prometheus reaches it via host.docker.internal (see extra_hosts on prometheus service).
  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node_exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    user: "65534"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: loki
    restart: unless-stopped
    user: "10001"
    networks:
      - observability
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
      - ./loki/loki.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml

  # Promtail - Log Shipper
  promtail:
    # 2.9.3 embeds Docker SDK API v1.42; host daemon requires v1.44 minimum.
    # 3.x ships with a newer SDK that negotiates v1.44+ correctly.
    # Loki stays at 2.9.3 — the push API is stable across major versions.
    image: grafana/promtail:3.3.2
    container_name: promtail
    restart: unless-stopped
    networks:
      - observability
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  # cAdvisor - Container Metrics (Optional)
  # gcr.io images (≤v0.49.x) embed Docker SDK API v1.41 — incompatible with Docker CE 25+.
  # v0.55.1+ ships with a newer SDK that supports v1.44+.
  # Note: ghcr.io/google/cadvisor tags do NOT exist despite the README claiming migration there.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    networks:
      - observability
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    # devices: /dev/kmsg removed - not available in VirtualBox VMs
