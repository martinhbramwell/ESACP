global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'esacp'
    environment: 'development'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - Host metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Alertmanager
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Grafana (serve_from_sub_path=true routes metrics to /grafana/metrics)
  - job_name: 'grafana'
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ['grafana:3000']

  # Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # Promtail
  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']

  # Future: ERPNext metrics endpoint
  # - job_name: 'erpnext'
  #   static_configs:
  #     - targets: ['erpnext:8000']

  # Future: MariaDB exporter
  # - job_name: 'mariadb'
  #   static_configs:
  #     - targets: ['mariadb-exporter:9104']
