# in_place_core_edit drift names are emitted as `<DocType>-<fieldname>` for
# `fields[X]` additions (see `tools/customisation_audit/core_diff_added_field.py`,
# rule 2.5 / #347), and as the path-form (e.g. `frappe/.../user.json#N`) for
# DocPerm + translation CSV drifts. Attribution keys must match drift.name.
#
# Sales Order :: data_90 is intentionally absent from this map. Production query
# (#356, 2026-05-07) confirms the column is empty across all rows; the field is
# discardable rather than fixture-equivalent. The Phase 1 sub-branch reverts the
# corresponding core JSON edit without writing a fixture, so the drift evaporates
# without an associated Custom Field.
