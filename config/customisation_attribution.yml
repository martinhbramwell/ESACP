# Operator-curated customisation attribution.
#
# When a discover_*.py module finds a DB-only customisation row that lacks
# a `module` column on the substrate (Frappe v13 schema), it consults this
# file to determine which bespoke app should own the row and how Phase 2
# should promote it.
#
# Format: drift_class -> row_name -> { owning_app, promotion_strategy }
#
# Run `./tools/identify_bad_customisations.py --substrate <vm> --write-stubs`
# to append TODO placeholders for newly-discovered unmapped names; then
# replace each TODO with the appropriate value:
#
#   owning_app:          ce_sri | returnable | route_planner | in_core | not_ours
#   promotion_strategy:  fixture_json | fixtures_custom_scripts | app_translations_csv |
#                        v14_patch_script | manual | none
#
# `in_core` (added 2026-05-01): customisation lives in frappe/erpnext core,
# typically with paired Python controller code that can't be expressed as a
# bespoke-app fixture. Phase 5 generates a runtime v14 patch script that
# re-applies the customisation post-upgrade. NEVER manual.
#
# Entries with TODO in either field are treated as unresolved (audit emits
# `manual` strategy and counts the row as needing attribution).
#
# Use `owning_app: not_ours` + `promotion_strategy: none` to explicitly
# acknowledge a row as not-our-customisation (e.g. a Frappe regional artifact
# present in the production DB but not business-load-bearing). The audit then
# surfaces it with `none` strategy, distinguishing it from unresolved rows.
#
# Limitation: classes whose `name` column is an opaque hash (notably Custom
# DocPerm) are keyed by that hash here — unfriendly for human attribution.
# Phase 2 will revisit with a richer (parent + role + permlevel) schema.
#
# auto_rules (#319): consulted AFTER per-name lookup. Each rule has a
# `class`, a `when:` block (matchers), and a `then:` block (resolution).
# All matchers in a rule's `when:` must pass (AND). First matching rule
# wins. Per-name operator-resolved entries override auto-rules.
#
# Supported matchers:
#   dt_in:        list — row["dt"] must be in the list
#   name_pattern: str  — drift name must match SQL LIKE pattern (% → .*)
#   view:         str  — exact match on row["view"]
#   standard:     str  — exact match on row["standard"]

auto_rules:
  - class: custom_field
    when:
      dt_in: [Sales Order, Customer, Quotation, Sales Invoice, Purchase Invoice, Delivery Note]
    then:
      owning_app: ce_sri
      promotion_strategy: fixture_json
  - class: client_script
    when:
      name_pattern: '%-Form'
      view: Form
    then:
      owning_app: ce_sri
      promotion_strategy: fixtures_custom_scripts
  - class: print_format
    when:
      standard: 'No'
      name_pattern: 'PF:%'
    then:
      owning_app: ce_sri
      promotion_strategy: v14_patch_script
  - class: print_format
    when:
      standard: 'No'
      name_pattern: 'FdI:%'
    then:
      owning_app: ce_sri
      promotion_strategy: v14_patch_script

custom_field:
  Customer-compras:
    owning_app: returnable
    promotion_strategy: fixture_json
property_setter: {}
client_script:
  Delivery Trip-Form:
    owning_app: route_planner
    promotion_strategy: fixtures_custom_scripts
print_format:
  IRS 1099 Form:
    owning_app: not_ours
    promotion_strategy: none
