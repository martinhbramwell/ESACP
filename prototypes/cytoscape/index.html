<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ESACP Topology</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <h1>ESACP Network Topology</h1>
      </header>
      <div id="cy"></div>
      <div id="resize-handle"><span class="grip"></span></div>
      <div id="info-panel">
        <p class="hint">Click a node or edge to inspect it. Click saconsole to explore its containers.</p>
      </div>
    </div>

    <!-- Drill-down popup — outside #app to avoid flex constraints -->
    <div id="popup-overlay" class="hidden">
      <div id="popup">
        <div id="popup-header">
          <nav id="popup-breadcrumb"></nav>
          <button id="popup-close" title="Close (Esc)">✕</button>
        </div>
        <div id="popup-cy"></div>
        <div id="popup-resize-handle"><span class="grip"></span></div>
        <div id="popup-info">
          <p class="hint">Click a node to inspect it.</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
