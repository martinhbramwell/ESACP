# hosts_map.yml — ESACP Authoritative Host Directory
#
# Single source of truth for all host identities.
# Both Ansible inventory and WireGuard peer configs are derived from this file.
#
# After any change here, regenerate the Ansible inventory:
#   python tools/generate_inventory.py
#
# ansible_managed: true  → host is provisioned by Ansible
# ansible_managed: false → host appears as WireGuard peer only (manually configured)

wireguard_subnet: "10.10.0.0/24"
wireguard_port: 51820

zone_domains:
  development: "iridium.blue"
  staging: "iridium.blue"
  production: "yourpublic.work"

# backend values: kvm | vbox | cloudstack | vps
# wg_hub_endpoint: the physical address spokes use to reach the hub.
#   KVM:   virbr0 IP (192.168.122.10) — stable, internal to the host.
#   vbox:  hub's bridged LAN IP — set in ansible/group_vars/vbox.yml since
#          it varies by LAN. Leave blank here; group_vars overrides.
#
# target_frappe_major: optional per-host integer (13 / 14 / 15 / 16 / …).
#   The frappe major version this host is being prepared for. Absent ⇒ 13
#   (default, matches packer-baked v13-era image). When ≥ 16, the
#   `frappe_substrate_v16` ansible role installs Python 3.14, Node 24,
#   and pkg-config (see ESACP#445). Tracks substrate readiness for
#   incremental V16 cutover (see [[end-state-v16-lts-current-stack]]).
#   Also selects which Packer template a host clones at provision time:
#   stage 1 reads erpnext-v{major}-latest.json (dual-template; ESACP#631).

groups:

  # ── KVM guests (Xubuntu workstation, Platform 2) ──────────────────────────
  kvm:
    saconsole:
      vm_name: saconsole
      hostname: saconsole
      display_name: "Hub Console"
      nickname: sac
      virbr0_ip: "192.168.122.10"
      wg_ip: "10.10.0.1"
      wg_role: hub
      wg_hub_endpoint: "192.168.122.10"
      ansible_managed: true
      backend: kvm
      hypervisor: toshiba
      ansible_groups:
        - kvm
        - development
        - lab

    dev03:
      vm_name: dev03
      hostname: dev03
      display_name: "Dev 03"
      nickname: D3IRBL
      virbr0_ip: "192.168.122.22"
      wg_ip: "10.10.0.14"
      wg_role: spoke
      ansible_managed: true
      backend: kvm
      hypervisor: toshiba
      vm_role: dev:unspecified
      expected_state: "off"
      ansible_groups:
        - kvm
        - targets
        - development
        - lab

    target5:
      vm_name: target5
      hostname: target5
      nickname: T5IRBL
      virbr0_ip: "192.168.122.25"
      wg_ip: "10.10.0.15"
      wg_role: spoke
      ansible_managed: true
      backend: kvm
      hypervisor: toshiba
      vm_role: dev:unspecified
      expected_state: "off"
      ansible_groups:
        - kvm
        - targets
        - development
        - lab

    dev01:
      hostname: dev01
      nickname: dev0
      virbr0_ip: "192.168.122.26"
      wg_ip: "10.10.0.16"
      wg_role: spoke
      ansible_managed: true
      backend: kvm
      hypervisor: toshiba
      vm_role: dev:unspecified
      ansible_groups:
        - kvm
        - targets
        - development
        - lab

    dev02:
      hostname: dev02
      nickname: dev0
      virbr0_ip: "192.168.122.27"
      wg_ip: "10.10.0.17"
      wg_role: spoke
      ansible_managed: true
      backend: kvm
      hypervisor: toshiba
      vm_role: dev:unspecified
      target_frappe_major: 16
      ansible_groups:
        - kvm
        - targets
        - development
        - lab

    # Beaverdam V15 baseline — fresh clean v15 substrate (ESACP #631).
    # Clones template_v15 (erpnext-v15-latest); provisioned generic (no prod data).
    dev15_01:
      hostname: dev15_01
      nickname: dev15
      virbr0_ip: "192.168.122.28"
      wg_ip: "10.10.0.18"
      wg_role: spoke
      ansible_managed: true
      backend: kvm
      hypervisor: toshiba
      vm_role: dev:unspecified
      target_frappe_major: 15
      ansible_groups:
        - kvm
        - targets
        - development
        - lab
  # ── VirtualBox guests (Windows/WSL workstation, Platform 1) ───────────────
  # wg_hub_endpoint for vbox saconsole is the console VM's bridged LAN IP.
  # Set it in ansible/group_vars/vbox.yml — it varies by LAN environment.
  vbox:
    saconsole:
      hostname: saconsole
      nickname: console
      wg_ip: "10.10.0.1"
      wg_role: hub
      wg_hub_endpoint: ""          # overridden in group_vars/vbox.yml
      ansible_managed: true
      backend: vbox
      ansible_groups:
        - vbox
        - development
        - lab

  # ── Management controller (this host) ─────────────────────────────────────
  # ansible_managed: true — WireGuard spoke config is applied by Ansible locally.
  # connection: local bypasses SSH; become: yes handles privilege escalation.
  controller:
    local:
      hostname: localhost       # Ansible inventory key — must be "localhost" to match Play 4
      nickname: "${HOSTNAME}"
      ansible_host: localhost
      ansible_connection: local
      wg_ip: "10.10.0.2"
      wg_role: spoke
      ansible_managed: true
      platform: kvm            # set to: kvm | vbox | macos
      # Operator's login on the bare-metal hypervisor — the ProxyJump user
      # in the generated Ansible inventory. Single source of truth for the
      # value formerly hardcoded as `hasan@` in generate_inventory.py
      # (ESACP#451). Falls back to $USER at regen time when unset.
      hypervisor_user: hasan
      ansible_groups:
        - controller

  # ── Mobile / roaming peers (manually configured WireGuard) ────────────────
  # ansible_managed: false → excluded from the generated Ansible inventory;
  # the hub learns these peers via `wg_external_peers` in group_vars/all.yml.
  # Ansible never connects to them (Windows/Android, configured by hand). The
  # standard spoke config (AllowedIPs 10.10.0.0/24 + hub forwarding) gives them
  # full-mesh reachability. (ESACP#383)
  mobile:
    iconia:
      hostname: iconia
      display_name: "Iconia Tablet"
      nickname: iconia
      wg_ip: "10.10.0.20"
      wg_role: spoke
      ansible_managed: false
      platform: windows
      device_class: tablet
      ansible_groups:
        - mobile

  # ── Future groups — define now, activate by populating ────────────────────
  dev_group: {}
  stage_group: {}
  staff_group: {}
  #
  # Example entry (when ready to activate):
  #
  # dev_group:
  #   dev1:
  #     hostname: <real-hostname>
  #     nickname: dev1
  #     wg_ip: "10.10.0.10"
  #     wg_role: spoke
  #     ansible_managed: true
  #     platform: kvm
  #     ansible_groups:
  #       - dev_group
  #       - development
  #
  # staff_group:
  #   staff1:
  #     hostname: <bob-hostname>
  #     nickname: staff1
  #     wg_ip: "10.10.0.20"
  #     wg_role: spoke
  #     ansible_managed: false   # manually configured, VPN peer only
  #     platform: macos
